name: Python Quality Gates

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # GATE 1: Lint
      - name: Gate 1 - Ruff lint
        run: |
          ruff check .

      # GATE 2: Tests + 80% coverage
      - name: Gate 2 - Pytest coverage
        run: |
          pytest --cov=student_account --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      # GATE 3: Security
      - name: Gate 3 - Bandit security scan
        run: |
          bandit -r src

      # Only reached if all three gates pass
      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-account-wheel
          path: dist/*.whl
